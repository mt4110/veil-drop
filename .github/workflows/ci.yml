name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: versions
        name: Read pinned tool versions
        shell: bash
        run: scripts/read-mise-versions.sh >> "$GITHUB_OUTPUT"
      - name: Rust version pinned by mise
        run: |
          rustup default "${{ steps.versions.outputs.rust }}"
          rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
  receiver:
    name: Architecture and Web Crypto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: versions
        name: Read pinned tool versions
        shell: bash
        run: scripts/read-mise-versions.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: rustup default "${{ steps.versions.outputs.rust }}"
      - run: cargo build --locked
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run lint:markdown
      - run: npm test
      - name: Verify pinned tool versions are active
        run: |
          test "$(rustc --version | awk '{print $2}')" = "${{ steps.versions.outputs.rust }}"
          test "$(node --version | sed 's/^v//')" = "${{ steps.versions.outputs.node }}"
  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: versions
        name: Read pinned tool versions
        shell: bash
        run: scripts/read-mise-versions.sh >> "$GITHUB_OUTPUT"
      - run: rustup default "${{ steps.versions.outputs.rust }}"
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: cargo audit --deny warnings
  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [rust, receiver, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
